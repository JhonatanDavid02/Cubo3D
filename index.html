<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D — Visualizador PBR Interactivo WebGL</title>
  <meta name="description" content="Visualizador 3D interactivo con Three.js. Renderizado basado en física (PBR), materiales translúcidos, sombreado y control orbital.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #08090e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-bg: rgba(18, 22, 34, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.12);
      --active-accent: #06b6d4;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #111422 0%, #08090e 70%, #040508 100%);
    }

    .canvas-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Floating Header */
    .scene-header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      pointer-events: auto;
      animation: fadeInDown 0.6s ease-out;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      color: var(--active-accent);
      filter: drop-shadow(0 0 6px var(--active-accent));
      transition: var(--transition);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #22c55e; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Interaction Hint */
    .interaction-hint {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--text-muted);
      pointer-events: none;
      animation: fadeInDown 0.6s ease-out;
    }

    .hint-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-item kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 10px;
      color: #fff;
    }

    /* Floating Controls Bar at Bottom */
    .controls-bar {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      pointer-events: auto;
      animation: fadeInUp 0.6s ease-out;
      max-width: 90vw;
    }

    .control-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .control-btn.active {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--active-accent);
      color: #fff;
      box-shadow: 0 0 14px -3px var(--active-accent);
    }

    .control-btn svg {
      width: 16px;
      height: 16px;
    }

    .separator {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Color Palettes */
    .palette-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .color-swatch:hover {
      transform: scale(1.18);
    }

    .color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.22);
      box-shadow: 0 0 12px var(--swatch-color);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 768px) {
      .interaction-hint { display: none; }
      .scene-header { top: 16px; left: 16px; padding: 8px 14px; }
      .controls-bar { bottom: 16px; padding: 8px 12px; gap: 8px; }
      .control-btn span { display: none; }
      .control-btn { padding: 8px; }
    }
  </style>
</head>
<body>

  <main class="app-container" id="app-root">

    <!-- Header -->
    <header class="scene-header glass-panel">
      <div class="brand">
        <svg class="brand-icon" id="brand-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.12 6.4-6.05-4.06a2 2 0 0 0-2.17-.05L2.9 6.4A2 2 0 0 0 2 8.18v7.64a2 2 0 0 0 .9 1.78l9.98 4.1a2 2 0 0 0 2.22 0l6.02-4.1a2 2 0 0 0 .88-1.78V8.18a2 2 0 0 0-.88-1.78Z" />
          <path d="M12 22V12" />
          <path d="m3.29 7 8.71 5 8.71-5" />
        </svg>
        <span class="brand-title">Cubo 3D</span>
      </div>
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span>Three.js + WebGL</span>
      </div>
      <a href="../index.html" class="status-badge" style="text-decoration: none; color: #fff; cursor: pointer; transition: var(--transition);" onmouseover="this.style.borderColor='var(--active-accent)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)'">
        <span>← Portafolio</span>
      </a>
    </header>

    <!-- Interaction Hints -->
    <div class="interaction-hint glass-panel">
      <div class="hint-item"><span>Rotar:</span> <kbd>Arrastrar</kbd></div>
      <div class="hint-item"><span>Zoom:</span> <kbd>Rueda</kbd></div>
      <div class="hint-item"><span>Pausa:</span> <kbd>Espacio</kbd></div>
    </div>

    <!-- WebGL Canvas Container -->
    <section class="canvas-wrapper" id="canvas-container"></section>

    <!-- Bottom Controls Dock -->
    <nav class="controls-bar glass-panel">
      <!-- Toggle Rotation -->
      <button type="button" id="btn-rotate" class="control-btn active" title="Pausar rotación (Espacio)">
        <svg id="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
        <svg id="icon-play" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <span id="label-rotate">Pausar</span>
      </button>

      <!-- Toggle Wireframe -->
      <button type="button" id="btn-wireframe" class="control-btn" title="Alternar estructura alámbrica (W)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18" />
          <path d="M3 15h18" />
          <path d="M9 3v18" />
          <path d="M15 3v18" />
        </svg>
        <span>Malla</span>
      </button>

      <!-- Reset Camera -->
      <button type="button" id="btn-reset" class="control-btn" title="Centrar cámara (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        <span>Centrar</span>
      </button>

      <div class="separator"></div>

      <!-- Color Swatches -->
      <div class="palette-group" id="palette-group"></div>
    </nav>

  </main>

  <!-- Three.js y OrbitControls locales: Carga 100% directa y offline sin dependencias externas -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>

  <script>
    function initCubeApp() {
      if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
        setTimeout(initCubeApp, 40);
        return;
      }

      // Presets definition
    const COLOR_PRESETS = [
      { id: 'cyberpunk', name: 'Neón Cyberpunk', color: '#6366f1', accentColor: '#06b6d4', emissive: '#1e1b4b' },
      { id: 'amethyst', name: 'Amatista Púrpura', color: '#a855f7', accentColor: '#ec4899', emissive: '#3b0764' },
      { id: 'ice', name: 'Azul Glacial', color: '#0ea5e9', accentColor: '#38bdf8', emissive: '#082f49' },
      { id: 'emerald', name: 'Esmeralda Cuántico', color: '#10b981', accentColor: '#34d399', emissive: '#064e3b' },
      { id: 'amber', name: 'Obsidiana Dorada', color: '#f59e0b', accentColor: '#fbbf24', emissive: '#451a03' }
    ];

    let currentPreset = COLOR_PRESETS[0];
    let isRotating = true;
    let isWireframe = false;

    // UI elements
    const appRoot = document.getElementById('app-root');
    const container = document.getElementById('canvas-container');
    const btnRotate = document.getElementById('btn-rotate');
    const btnWireframe = document.getElementById('btn-wireframe');
    const btnReset = document.getElementById('btn-reset');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    const labelRotate = document.getElementById('label-rotate');
    const paletteGroup = document.getElementById('palette-group');

    // Build Palette Swatches
    COLOR_PRESETS.forEach(preset => {
      const swatch = document.createElement('button');
      swatch.type = 'button';
      swatch.className = `color-swatch ${preset.id === currentPreset.id ? 'active' : ''}`;
      swatch.style.backgroundColor = preset.color;
      swatch.style.setProperty('--swatch-color', preset.accentColor);
      swatch.title = preset.name;
      swatch.addEventListener('click', () => {
        setPreset(preset);
      });
      paletteGroup.appendChild(swatch);
    });

    function setPreset(preset) {
      currentPreset = preset;
      appRoot.style.setProperty('--active-accent', preset.accentColor);

      // Update active swatch
      document.querySelectorAll('.color-swatch').forEach((s, idx) => {
        s.classList.toggle('active', COLOR_PRESETS[idx].id === preset.id);
      });

      // Update 3D Materials
      updateCubeMaterial();
      rimLight.color.set(preset.accentColor);
      pointLight.color.set(preset.accentColor);
      outerRingMat.color.set(preset.accentColor);
      innerRingMat.color.set(preset.accentColor);
      sparklesMat.color.set(preset.accentColor);
    }

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#08090e');
    scene.fog = new THREE.Fog('#08090e', 11, 25);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    const initialPos = new THREE.Vector3(3.8, 2.5, 4.3);
    camera.position.copy(initialPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.4;
    controls.maxDistance = 11;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.3);
    dirLight.position.set(5, 7.5, 4.5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 20;
    dirLight.shadow.bias = -0.0004;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(currentPreset.accentColor, 0.95);
    rimLight.position.set(-5, 3.5, -4);
    scene.add(rimLight);

    const pointLight = new THREE.PointLight(currentPreset.accentColor, 0.8, 3.5);
    pointLight.position.set(0, -0.8, 0);
    scene.add(pointLight);

    // Starfield Background
    const starsCount = 1500;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount; i++) {
      const r = 35 + Math.random() * 25;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i * 3 + 0] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i * 3 + 2] = r * Math.cos(phi);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.22, transparent: true, opacity: 0.65 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // Floating Sparkles
    const sparklesCount = 50;
    const sparkleGeo = new THREE.BufferGeometry();
    const sparklePos = new Float32Array(sparklesCount * 3);
    for (let i = 0; i < sparklesCount; i++) {
      sparklePos[i * 3 + 0] = (Math.random() - 0.5) * 6;
      sparklePos[i * 3 + 1] = (Math.random() - 0.5) * 4 + 0.5;
      sparklePos[i * 3 + 2] = (Math.random() - 0.5) * 6;
    }
    sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePos, 3));
    const sparklesMat = new THREE.PointsMaterial({
      color: currentPreset.accentColor,
      size: 0.12,
      transparent: true,
      opacity: 0.6
    });
    const sparkles = new THREE.Points(sparkleGeo, sparklesMat);
    scene.add(sparkles);

    // Pedestal Platform
    const platformGroup = new THREE.Group();
    platformGroup.position.set(0, -1.35, 0);

    // Upper cylinder deck
    const deckMat = new THREE.MeshStandardMaterial({ color: 0x121622, metalness: 0.65, roughness: 0.32 });
    const deck = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.45, 0.14, 64), deckMat);
    deck.position.set(0, -0.06, 0);
    deck.receiveShadow = true;
    platformGroup.add(deck);

    // Lower base
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x0b0d13, metalness: 0.8, roughness: 0.5 });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.62, 0.08, 64), baseMat);
    base.position.set(0, -0.15, 0);
    base.receiveShadow = true;
    platformGroup.add(base);

    // Glowing Neon Rings on deck
    const outerRingMat = new THREE.MeshBasicMaterial({ color: currentPreset.accentColor, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const outerRing = new THREE.Mesh(new THREE.RingGeometry(2.08, 2.14, 64), outerRingMat);
    outerRing.rotation.x = -Math.PI / 2;
    outerRing.position.set(0, 0.012, 0);
    platformGroup.add(outerRing);

    const innerRingMat = new THREE.MeshBasicMaterial({ color: currentPreset.accentColor, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
    const innerRing = new THREE.Mesh(new THREE.RingGeometry(1.38, 1.41, 64), innerRingMat);
    innerRing.rotation.x = -Math.PI / 2;
    innerRing.position.set(0, 0.011, 0);
    platformGroup.add(innerRing);

    // Soft Radial Contact Shadow Texture
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 128;
    shadowCanvas.height = 128;
    const shadowCtx = shadowCanvas.getContext('2d');
    const grad = shadowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
    grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.4)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    shadowCtx.fillStyle = grad;
    shadowCtx.fillRect(0, 0, 128, 128);
    const shadowTex = new THREE.CanvasTexture(shadowCanvas);

    const shadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(3.2, 3.2),
      new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.set(0, 0.015, 0);
    platformGroup.add(shadowPlane);

    scene.add(platformGroup);

    // Floating Cube
    const cubeGroup = new THREE.Group();
    cubeGroup.position.set(0, 0.2, 0);

    // Create Cube with beveled edges using BoxGeometry segments or chamfer
    const cubeGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5, 8, 8, 8);
    let cubeMat = createCubeMaterial();
    const cubeMesh = new THREE.Mesh(cubeGeo, cubeMat);
    cubeMesh.castShadow = true;
    cubeMesh.receiveShadow = true;
    cubeGroup.add(cubeMesh);
    scene.add(cubeGroup);

    function createCubeMaterial() {
      if (isWireframe) {
        return new THREE.MeshStandardMaterial({
          wireframe: true,
          color: currentPreset.accentColor,
          emissive: currentPreset.accentColor,
          emissiveIntensity: 0.7
        });
      } else {
        return new THREE.MeshPhysicalMaterial({
          color: currentPreset.color,
          emissive: currentPreset.emissive,
          emissiveIntensity: 0.15,
          metalness: 0.75,
          roughness: 0.16,
          clearcoat: 1.0,
          clearcoatRoughness: 0.1,
          reflectivity: 0.9
        });
      }
    }

    function updateCubeMaterial() {
      cubeMesh.material.dispose();
      cubeMesh.material = createCubeMaterial();
    }

    // Raycaster for Hover interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    let isHovered = false;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Toggle Rotar
    btnRotate.addEventListener('click', () => {
      isRotating = !isRotating;
      btnRotate.classList.toggle('active', isRotating);
      iconPause.style.display = isRotating ? 'block' : 'none';
      iconPlay.style.display = isRotating ? 'none' : 'block';
      labelRotate.textContent = isRotating ? 'Pausar' : 'Rotar';
    });

    // Toggle Wireframe
    btnWireframe.addEventListener('click', () => {
      isWireframe = !isWireframe;
      btnWireframe.classList.toggle('active', isWireframe);
      updateCubeMaterial();
    });

    // Reset Camera
    btnReset.addEventListener('click', resetCamera);

    function resetCamera() {
      controls.target.set(0, 0, 0);
      camera.position.copy(initialPos);
      controls.update();
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        btnRotate.click();
      } else if (e.key === 'w' || e.key === 'W') {
        btnWireframe.click();
      } else if (e.key === 'r' || e.key === 'R') {
        resetCamera();
      }
    });

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      // Check hover
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(cubeMesh);
      isHovered = intersects.length > 0;

      // Rotate Cube
      if (isRotating) {
        cubeMesh.rotation.x += delta * 0.35;
        cubeMesh.rotation.y += delta * 0.45;
      }

      // Harmonic vertical floating
      const targetY = Math.sin(t * 1.5) * 0.12 + 0.15;
      cubeMesh.position.y = THREE.MathUtils.lerp(cubeMesh.position.y, targetY, delta * 4);

      // Micro-scale hover animation
      const targetScale = isHovered ? 1.08 : 1.0;
      cubeMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), delta * 8);

      // Subtle sparkle drift
      sparkles.rotation.y = t * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCubeApp);
  } else {
    initCubeApp();
  }
</script>
</body>
</html>
